# SMOKE SUITE
# Runs on every pull request and every push to main.
# Goal: a fast (~few minutes) "is the core of the site working?" check.
# If it fails, the PR should not be merged (make this a required check
# under Settings > Branches > Branch protection rules).
#
# WHY ONLY API TESTS IN CI:
# The Toolshop website is protected by Cloudflare bot detection. Automated
# browsers running on GitHub's servers get a "verifying you are not a bot" page
# instead of the store, so UI tests can't run here. The API is not blocked.
# UI tests run locally (npm run test:smoke). Use "Run workflow" with
# include_ui = true to try the UI tests in CI anyway.
# On a real team, CI would test a dedicated test environment instead.
name: Smoke Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_ui:
        description: 'Also run UI tests (currently blocked by Cloudflare in CI)'
        type: boolean
        default: false

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: ${{ vars.BASE_URL || 'https://practicesoftwaretesting.com' }}
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.practicesoftwaretesting.com' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Install Chromium
        if: ${{ inputs.include_ui }}
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: |
          PROJECTS="--project=api"
          if [ "${{ inputs.include_ui }}" = "true" ]; then PROJECTS="--project=chromium --project=api"; fi
          npx playwright test --grep @smoke $PROJECTS --reporter=html,github,list

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 14
